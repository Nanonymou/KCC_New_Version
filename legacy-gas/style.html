<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c-primary   : #1e3a5f;
    --c-accent    : #e8a020;
    --c-danger    : #d64045;
    --c-success   : #2d9e6b;
    --c-warn      : #e8a020;
    --c-bg        : #f5f6fa;
    --c-surface   : #ffffff;
    --c-border    : #dde1ea;
    --c-text      : #1a1d23;
    --c-muted     : #6b7280;
    --radius      : 8px;
    --shadow      : 0 1px 4px rgba(0,0,0,.10);
    --shadow-md   : 0 4px 16px rgba(0,0,0,.12);
    --transition  : .18s ease;
  }

  body {
    font-family : 'Inter', 'Segoe UI', system-ui, sans-serif;
    background  : var(--c-bg);
    color       : var(--c-text);
    font-size   : 14px;
    line-height : 1.5;
  }

  /* ── Layout ── */
  .app-layout {
    display    : flex;
    min-height : 100vh;
  }

  .sidebar {
    width          : 220px;
    background     : var(--c-primary);
    color          : #fff;
    flex-shrink    : 0;
    display        : flex;
    flex-direction : column;
    position       : sticky;
    top            : 0;
    height         : 100vh;
    overflow-y     : auto;
  }

  .sidebar-brand {
    padding        : 20px 16px;
    font-size      : 15px;
    font-weight    : 700;
    border-bottom  : 1px solid rgba(255,255,255,.12);
    letter-spacing : .02em;
    flex-shrink    : 0;
  }

  .sidebar-brand span {
    display     : block;
    font-size   : 10px;
    font-weight : 400;
    opacity     : .6;
    margin-top  : 2px;
  }

  .sidebar-footer { margin-top: auto; border-top: 1px solid rgba(255,255,255,.08); }

  nav { flex: 1; }

  .nav-section { padding: 12px 0 4px; }

  .nav-label {
    padding        : 0 16px 4px;
    font-size      : 10px;
    text-transform : uppercase;
    letter-spacing : .08em;
    opacity        : .5;
  }

  .nav-item {
    display     : flex;
    align-items : center;
    gap         : 10px;
    padding     : 9px 16px;
    cursor      : pointer;
    font-size   : 13px;
    color       : rgba(255,255,255,.75);
    transition  : background var(--transition), color var(--transition);
    border-left : 3px solid transparent;
    user-select : none;
  }

  .nav-item:hover  { background: rgba(255,255,255,.08); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.12); color: #fff; border-left-color: var(--c-accent); }
  .nav-item .icon  { width: 18px; text-align: center; }

  .main-content {
    flex     : 1;
    overflow : auto;
    padding  : 28px 28px 40px;
    min-width: 0;
  }

  /* ── Page Header ── */
  .page-header {
    display         : flex;
    align-items     : center;
    justify-content : space-between;
    margin-bottom   : 20px;
    gap             : 12px;
    flex-wrap       : wrap;
  }

  .page-title    { font-size: 20px; font-weight: 700; color: var(--c-primary); }
  .page-subtitle { font-size: 13px; color: var(--c-muted); margin-top: 2px; }

  /* ── Card ── */
  .card {
    background    : var(--c-surface);
    border-radius : var(--radius);
    box-shadow    : var(--shadow);
    border        : 1px solid var(--c-border);
    overflow      : hidden;
  }

  .card-header {
    display         : flex;
    align-items     : center;
    justify-content : space-between;
    padding         : 14px 18px;
    border-bottom   : 1px solid var(--c-border);
    font-weight     : 600;
    font-size       : 14px;
    color           : var(--c-primary);
  }

  .card-body { padding: 16px 18px; }

  /* ── Filter Bar ── */
  .filter-bar {
    display         : flex;
    align-items     : center;
    gap             : 10px;
    padding         : 12px 18px;
    border-bottom   : 1px solid var(--c-border);
    background      : #fafbfc;
    flex-wrap       : wrap;
  }

  .filter-bar input, .filter-bar select {
    padding       : 6px 10px;
    border        : 1px solid var(--c-border);
    border-radius : 6px;
    font-size     : 13px;
    outline       : none;
    background    : #fff;
    color         : var(--c-text);
    transition    : border-color var(--transition);
  }

  .filter-bar input:focus, .filter-bar select:focus {
    border-color: var(--c-primary);
  }

  .filter-bar input[type="search"] { width: 220px; }
  .filter-bar label { font-size: 12px; color: var(--c-muted); }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }

  table {
    width           : 100%;
    border-collapse : collapse;
    font-size       : 13px;
  }

  thead th {
    background     : #f8f9fb;
    padding        : 10px 14px;
    text-align     : left;
    font-weight    : 600;
    color          : var(--c-muted);
    font-size      : 11px;
    text-transform : uppercase;
    letter-spacing : .04em;
    white-space    : nowrap;
    border-bottom  : 1px solid var(--c-border);
  }

  tbody td {
    padding       : 11px 14px;
    border-bottom : 1px solid #f1f3f7;
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbff; }

  code {
    font-family   : 'Courier New', monospace;
    font-size     : 11px;
    background    : #eef0f5;
    padding       : 2px 6px;
    border-radius : 4px;
    color         : var(--c-primary);
  }

  /* ── Actions column ── */
  .td-actions {
    display    : flex;
    gap        : 6px;
    align-items: center;
    white-space: nowrap;
  }

  /* ── Badge ── */
  .badge {
    display       : inline-flex;
    align-items   : center;
    gap           : 4px;
    padding       : 3px 8px;
    border-radius : 12px;
    font-size     : 11px;
    font-weight   : 600;
    white-space   : nowrap;
  }

  .badge-success { background: #e8f7f1; color: #1e7a54; }
  .badge-danger  { background: #fdecea; color: #b53030; }
  .badge-muted   { background: #f0f1f4; color: #6b7280; }
  .badge-warn    { background: #fef3e2; color: #a0640a; }

  /* ── Buttons ── */
  .btn {
    display       : inline-flex;
    align-items   : center;
    gap           : 6px;
    padding       : 8px 16px;
    border-radius : 6px;
    font-size     : 13px;
    font-weight   : 500;
    cursor        : pointer;
    border        : none;
    transition    : background var(--transition), opacity var(--transition), transform .1s;
    white-space   : nowrap;
    user-select   : none;
    line-height   : 1;
  }

  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .btn-primary { background: var(--c-primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #15305a; }

  .btn-accent  { background: var(--c-accent); color: #fff; }
  .btn-accent:hover:not(:disabled) { background: #cf8f1a; }

  .btn-ghost {
    background : transparent;
    color      : var(--c-primary);
    border     : 1px solid var(--c-border);
  }
  .btn-ghost:hover:not(:disabled) { background: #f0f3f8; }

  .btn-danger { background: var(--c-danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #b83038; }

  .btn-success { background: var(--c-success); color: #fff; }
  .btn-success:hover:not(:disabled) { background: #24865a; }

  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .btn-close {
    background : transparent;
    border     : none;
    font-size  : 20px;
    cursor     : pointer;
    color      : var(--c-muted);
    line-height: 1;
    padding    : 0 2px;
  }
  .btn-close:hover { color: var(--c-text); }

  /* ── Forms ── */
  .form-grid {
    display               : grid;
    grid-template-columns : repeat(2, 1fr);
    gap                   : 14px;
  }

  .form-grid-3 {
    display               : grid;
    grid-template-columns : repeat(3, 1fr);
    gap                   : 14px;
  }

  @media (max-width: 600px) {
    .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
  }

  /* ── Mobile Responsive Layout ── */
  @media (max-width: 768px) {
    .app-layout { flex-direction: column; }

    .sidebar {
      width      : 100%;
      height     : auto;
      position   : static;
      flex-direction : row;
      flex-wrap  : wrap;
      overflow-y : visible;
    }

    .sidebar-brand {
      padding    : 12px 16px;
      flex       : 1 1 auto;
      border-bottom : none;
      border-right  : 1px solid rgba(255,255,255,.12);
    }

    .sidebar-footer { display: none; }

    nav {
      display  : flex;
      flex-wrap: wrap;
      flex     : 1 1 auto;
      padding  : 4px 8px;
    }

    .nav-section {
      display : flex;
      flex-wrap: wrap;
      padding : 4px 0;
      gap     : 2px;
    }

    .nav-label { display: none; }

    .nav-item {
      padding     : 6px 10px;
      font-size   : 12px;
      border-left : none;
      border-radius: 6px;
      border-bottom: 2px solid transparent;
    }

    .nav-item.active {
      border-left-color  : transparent;
      border-bottom-color: var(--c-accent);
    }

    .nav-item .icon { width: auto; }

    .main-content { padding: 16px 12px 32px; }

    .page-header {
      flex-direction: column;
      align-items   : flex-start;
      gap           : 10px;
    }

    .page-header .btn { width: 100%; justify-content: center; }

    .filter-bar {
      flex-direction: column;
      gap           : 8px;
    }

    .filter-bar input[type="search"] { width: 100%; }

    .filter-bar label { width: 100%; }

    .filter-bar select { width: 100%; }

    /* Tabel scrollable pada layar kecil */
    .table-wrap {
      -webkit-overflow-scrolling: touch;
    }

    /* Card padding lebih kecil */
    .card { padding: 12px; }

    /* Aksi tabel — tumpuk vertikal jika perlu */
    .td-actions { flex-wrap: wrap; gap: 4px; }

    /* Modal full-width di mobile */
    .modal {
      width  : calc(100vw - 24px);
      max-width: none !important;
      margin : 12px;
    }
  }

  .form-group { display: flex; flex-direction: column; gap: 5px; }

  .form-label {
    font-size   : 12px;
    font-weight : 600;
    color       : var(--c-muted);
    text-transform : uppercase;
    letter-spacing : .03em;
  }

  .form-label .req { color: var(--c-danger); margin-left: 2px; }

  .form-control {
    padding       : 8px 10px;
    border        : 1px solid var(--c-border);
    border-radius : 6px;
    font-size     : 13px;
    outline       : none;
    background    : #fff;
    color         : var(--c-text);
    transition    : border-color var(--transition), box-shadow var(--transition);
    width         : 100%;
  }

  .form-control:focus {
    border-color : var(--c-primary);
    box-shadow   : 0 0 0 3px rgba(30,58,95,.10);
  }

  .form-control:disabled { background: #f3f4f6; color: var(--c-muted); }

  .form-hint { font-size: 11px; color: var(--c-muted); }

  textarea.form-control { resize: vertical; min-height: 70px; }

  /* ── Modal ── */
  .modal-overlay {
    position        : fixed;
    inset           : 0;
    background      : rgba(0,0,0,.45);
    display         : flex;
    align-items     : center;
    justify-content : center;
    z-index         : 1000;
    padding         : 16px;
  }

  .modal-overlay.hidden { display: none; }

  .modal {
    background    : var(--c-surface);
    border-radius : 10px;
    box-shadow    : var(--shadow-md);
    width         : 100%;
    max-width     : 580px;
    max-height    : 90vh;
    display       : flex;
    flex-direction: column;
    animation     : modalIn .18s ease;
  }

  .modal-lg { max-width: 720px; }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-12px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .modal-header {
    display         : flex;
    align-items     : center;
    justify-content : space-between;
    padding         : 16px 20px;
    border-bottom   : 1px solid var(--c-border);
    font-weight     : 700;
    font-size       : 15px;
    color           : var(--c-primary);
    flex-shrink     : 0;
  }

  .modal-body {
    padding    : 20px;
    overflow-y : auto;
    flex       : 1;
  }

  .modal-footer {
    display         : flex;
    justify-content : flex-end;
    gap             : 10px;
    padding         : 14px 20px;
    border-top      : 1px solid var(--c-border);
    flex-shrink     : 0;
  }

  /* ── Empty State ── */
  .empty-state {
    display         : flex;
    flex-direction  : column;
    align-items     : center;
    justify-content : center;
    padding         : 48px 24px;
    color           : var(--c-muted);
    text-align      : center;
    gap             : 10px;
  }

  .empty-state-icon { font-size: 40px; }
  .empty-state-text { font-size: 14px; }

  /* ── Loading ── */
  .loading {
    display         : flex;
    align-items     : center;
    justify-content : center;
    gap             : 12px;
    padding         : 60px;
    color           : var(--c-muted);
  }

  .spinner {
    width         : 20px;
    height        : 20px;
    border        : 2px solid var(--c-border);
    border-top-color: var(--c-primary);
    border-radius : 50%;
    animation     : spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  #toast-container {
    position : fixed;
    bottom   : 24px;
    right    : 24px;
    z-index  : 9999;
    display  : flex;
    flex-direction: column;
    gap      : 8px;
  }

  .toast {
    padding       : 12px 18px;
    border-radius : 8px;
    font-size     : 13px;
    font-weight   : 500;
    color         : #fff;
    box-shadow    : var(--shadow-md);
    animation     : toastIn .2s ease;
    max-width     : 340px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .toast-success { background: var(--c-success); }
  .toast-error   { background: var(--c-danger); }
  .toast-info    { background: var(--c-primary); }

  /* ── Divider ── */
  .divider {
    border     : none;
    border-top : 1px solid var(--c-border);
    margin     : 16px 0;
  }

  /* ── Full width helper ── */
  .col-full { grid-column: 1 / -1; }

  /* ── Confirm dialog ── */
  .confirm-body { text-align: center; padding: 8px 0 16px; }
  .confirm-body p { color: var(--c-muted); margin-top: 6px; font-size: 13px; }
</style>
